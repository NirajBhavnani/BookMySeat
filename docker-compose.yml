services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reservations
      POSTGRES_USER: reservations
      POSTGRES_PASSWORD: reservations
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservations -d reservations"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://reservations:reservations@db:5432/reservations
      ADMIN_TOKEN: local-development-admin-token
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data: